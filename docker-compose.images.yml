services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - orbit_postgres_data:/var/lib/postgresql/data

  app:
    image: ${ORBIT_IMAGE:-ghcr.io/projectkura/orbit:latest}
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  orbit_postgres_data:
